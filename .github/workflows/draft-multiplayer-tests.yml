name: Draft multiplayer Node regressions

on:
  push:
    branches:
      - feat/secure-online-rooms-draft

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker syntax and deterministic room tests
        working-directory: server/cloudflare
        run: |
          npm run check
          npm test

  local-workerd-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler and ephemeral WebSocket test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund ws@8.18.3
      - name: Generate synthetic local R2 fixture and seed isolated local state
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import prompts from "./src/public-prompts.json" with {type:"json"};
            const fixture=Object.fromEntries(prompts.bluff.fact.map((item,i)=>[
              item.factId,
              {answer:{en:"Fixture answer "+i,de:"Testantwort "+i},source:{name:"Offline synthetic test",url:"https://example.invalid/fact"}}
            ]));
            fs.writeFileSync(process.env.RUNNER_TEMP+"/party-facts.json",JSON.stringify(fixture));
          '
          npx --no-install wrangler r2 object put chaos-club-private-facts/chaos-club/room-facts.json --file "$RUNNER_TEMP/party-facts.json" --local --persist-to "$RUNNER_TEMP/party-state"
      - name: Run real local workerd and independent 4–6 WebSocket clients
        run: |
          export WRANGLER_SEND_METRICS=false
          start_workerd() {
            setsid npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/party-state" > "$RUNNER_TEMP/party-workerd.log" 2>&1 &
            SERVER_PID=$!
            READY=0
            for attempt in $(seq 1 50); do
              if curl --fail --silent --max-time 1 http://127.0.0.1:8787/health >/dev/null; then READY=1; break; fi
              sleep 1
            done
            if [ "$READY" != 1 ]; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          }
          stop_workerd() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill -TERM -- "-$SERVER_PID" 2>/dev/null || kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=""
            fi
          }
          trap stop_workerd EXIT
          start_workerd
          if ! node test/live-worker-smoke.mjs; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          if ! node test/admission-worker-smoke.mjs; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          node test/persistence-worker-smoke.mjs record
          stop_workerd
          sleep 1
          start_workerd
          if ! node test/persistence-worker-smoke.mjs verify; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi

  hibernation-eviction:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral official Workers Vitest integration
        run: npm install --no-save --no-package-lock --no-audit --no-fund vitest@^4.1.0 @cloudflare/vitest-plugin
      - name: Explicitly evict DO while live WebSockets survive
        run: npx --no-install vitest run --config vitest.hibernation.config.mjs
