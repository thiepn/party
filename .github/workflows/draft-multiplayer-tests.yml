name: Draft multiplayer Node regressions

on:
  push:
    branches:
      - feat/secure-online-rooms-draft

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker syntax and deterministic room tests
        working-directory: server/cloudflare
        run: |
          npm run check
          npm test

  local-workerd-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler and ephemeral WebSocket test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund ws@8.18.3
      - name: Generate synthetic local R2 fixture and seed isolated local state
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import prompts from "./src/public-prompts.json" with {type:"json"};
            const fixture=Object.fromEntries(prompts.bluff.fact.map((item,i)=>[
              item.factId,
              {answer:{en:"Fixture answer "+i,de:"Testantwort "+i},source:{name:"Offline synthetic test",url:"https://example.invalid/fact"}}
            ]));
            fs.writeFileSync(process.env.RUNNER_TEMP+"/party-facts.json",JSON.stringify(fixture));
          '
          npx --no-install wrangler r2 object put chaos-club-private-facts/chaos-club/room-facts.json --file "$RUNNER_TEMP/party-facts.json" --local --persist-to "$RUNNER_TEMP/party-state"
      - name: Run real local workerd and independent 4–6 WebSocket clients
        run: |
          export WRANGLER_SEND_METRICS=false
          start_workerd() {
            setsid npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/party-state" > "$RUNNER_TEMP/party-workerd.log" 2>&1 &
            SERVER_PID=$!
            READY=0
            for attempt in $(seq 1 50); do
              if curl --fail --silent --max-time 1 http://127.0.0.1:8787/health >/dev/null; then READY=1; break; fi
              sleep 1
            done
            if [ "$READY" != 1 ]; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          }
          stop_workerd() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill -TERM -- "-$SERVER_PID" 2>/dev/null || kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=""
            fi
          }
          trap stop_workerd EXIT
          start_workerd
          if ! node test/live-worker-smoke.mjs; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          if ! node test/admission-worker-smoke.mjs; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi
          node test/persistence-worker-smoke.mjs record
          stop_workerd
          sleep 1
          start_workerd
          if ! node test/persistence-worker-smoke.mjs verify; then cat "$RUNNER_TEMP/party-workerd.log"; exit 1; fi

  hibernation-eviction:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated official Workers Vitest integration
        run: |
          mkdir -p "$RUNNER_TEMP/party-eviction-tools"
          cd "$RUNNER_TEMP/party-eviction-tools"
          printf '{"name":"party-eviction-test-tools","version":"1.0.0","private":true}' > package.json
          yarn add --non-interactive --ignore-engines 'vitest@^4.1.0' '@cloudflare/vitest-plugin' 'wrangler@4.158.0'
          ln -s "$RUNNER_TEMP/party-eviction-tools/node_modules" "$GITHUB_WORKSPACE/server/cloudflare/node_modules"
      - name: Explicitly evict DO while live WebSockets survive
        run: npx --no-install vitest run --config vitest.hibernation.config.mjs

  local-chromium-admission:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver and WebKit only for local verification
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@^1.58.0
          node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Seed private synthetic facts in isolated local browser storage
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import prompts from "./src/public-prompts.json" with {type:"json"};
            const fixture=Object.fromEntries(prompts.bluff.fact.map((item,i)=>[
              item.factId,
              {answer:{en:"Synthetic answer "+i,de:"Testantwort "+i},source:{name:"Offline browser fixture",url:"https://example.invalid/test"}}
            ]));
            fs.writeFileSync(process.env.RUNNER_TEMP+"/party-browser-facts.json",JSON.stringify(fixture));
          '
          npx --no-install wrangler r2 object put chaos-club-private-facts/chaos-club/room-facts.json --file "$RUNNER_TEMP/party-browser-facts.json" --local --persist-to "$RUNNER_TEMP/party-browser-state"
      - name: Test four independent Chromium and WebKit browsers on loopback
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/public" > "$RUNNER_TEMP/party-static.log" 2>&1 &
          STATIC_PID=$!
          setsid npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 --var ALLOW_LOCAL_DEV:true --persist-to "$RUNNER_TEMP/party-browser-state" > "$RUNNER_TEMP/party-browser-workerd.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill -TERM -- "-$SERVER_PID" 2>/dev/null || kill "$SERVER_PID" 2>/dev/null || true
            kill "$STATIC_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 50); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8787/health >/dev/null &&
               curl --fail --silent --max-time 1 http://127.0.0.1:8080/room/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat "$RUNNER_TEMP/party-browser-workerd.log"; cat "$RUNNER_TEMP/party-static.log"; exit 1; fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:8080' -H 'content-type: application/json' -d '{}' http://127.0.0.1:8787/rooms)
          if [ "$STATUS" != 201 ]; then echo "Local development origin unavailable ($STATUS)"; cat "$RUNNER_TEMP/party-browser-workerd.log"; exit 1; fi
          if ! node test/browser-admission-smoke.mjs; then cat "$RUNNER_TEMP/party-browser-workerd.log"; exit 1; fi
          if ! CHAOS_BROWSER=webkit node test/browser-admission-smoke.mjs; then cat "$RUNNER_TEMP/party-browser-workerd.log"; exit 1; fi

  local-adversarial-resources:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local Wrangler and WebSocket probe client
        run: npm install --no-save --no-package-lock --no-audit --no-fund ws@8.18.3
      - name: Measure stalled close connections and shared-IP six-seat recovery in isolated workerd
        run: |
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          setsid npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/party-adversarial-state" > "$RUNNER_TEMP/party-adversarial-workerd.log" 2>&1 &
          SERVER_PID=$!
          export WRANGLER_PID="$SERVER_PID"
          trap 'kill -TERM -- "-$SERVER_PID" 2>/dev/null || kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8787/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat "$RUNNER_TEMP/party-adversarial-workerd.log"; exit 1; fi
          if ! node test/adversarial-resource-worker-smoke.mjs; then cat "$RUNNER_TEMP/party-adversarial-workerd.log"; exit 1; fi
